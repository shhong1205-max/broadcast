    .start:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005,#0000 40%,#0009);z-index:-1}
    .start-card{max-width:680px;padding:clamp(22px,4vw,42px);border:1px solid #ffffff20;background:#081116df;backdrop-filter:blur(12px);box-shadow:var(--shadow)}
    .eyebrow{margin:0 0 10px;color:var(--red);font-size:.82rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(3rem,9vw,7.8rem);line-height:.82;letter-spacing:-.06em;font-weight:500}
    h1 span{display:block;color:var(--amber);font-size:.32em;line-height:1.3;letter-spacing:.12em;margin-top:18px}
    .brief{max-width:55ch;margin:26px 0 0;color:#d2dad6;font-size:clamp(1rem,2vw,1.16rem);line-height:1.85}
    .start-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:30px}
    .primary,.ghost,.tool-btn{border:1px solid transparent;cursor:pointer;min-height:48px;padding:0 20px;font-weight:800;letter-spacing:.02em;transition:.2s ease}
    .primary{background:var(--red);color:white;box-shadow:0 8px 30px #d94b3f30}
    .primary:hover,.primary:focus-visible{background:#f05b4e;transform:translateY(-1px)}
    .ghost,.tool-btn{border-color:#ffffff29;background:#ffffff09}
    .ghost:hover,.ghost:focus-visible,.tool-btn:hover,.tool-btn:focus-visible{border-color:var(--teal);background:#77b9b116}
    .mode-note{color:var(--muted);font-size:.88rem}
    .game{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    .topbar{height:64px;padding:0 clamp(14px,2vw,28px);display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:#071015e8;backdrop-filter:blur(14px);position:sticky;top:0;z-index:25}
    .brand{font:700 1.05rem/1 Georgia,serif;letter-spacing:.12em;margin-right:auto}.brand em{font-style:normal;color:var(--red)}
    .room-name{color:var(--amber);font-size:.88rem;letter-spacing:.08em}
    .timer{font-variant-numeric:tabular-nums;color:#cbd3cf;padding:7px 10px;border:1px solid #ffffff18;background:#0005}
    .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff20;background:#ffffff08;cursor:pointer;font-size:1.05rem}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
    .viewport{min-width:0;display:grid;place-items:center;padding:clamp(10px,2vw,24px);position:relative;overflow:hidden}
    .scene{position:relative;width:min(100%,1420px);aspect-ratio:16/9;background:#020507;box-shadow:var(--shadow);border:1px solid #ffffff1a;overflow:hidden}
    .scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px #000a}
    .scene img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;z-index:3;border:1px solid transparent;background:transparent;border-radius:12px;cursor:pointer;padding:0}
    .hotspot:before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px #e4b45f00;transition:.2s ease}
    .hotspot:hover:before,.hotspot:focus-visible:before{box-shadow:inset 0 0 0 2px #e4b45fbb,0 0 24px #e4b45f40;background:#e4b45f0b}
    .hotspot span{position:absolute;left:50%;bottom:5px;translate:-50% 0;opacity:0;pointer-events:none;background:#071015e8;border:1px solid #e4b45f77;padding:5px 8px;white-space:nowrap;font-size:.78rem;transition:.2s ease}
    .hotspot:hover span,.hotspot:focus-visible span{opacity:1}
    .pulse:after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--amber);border-radius:50%;left:50%;top:50%;animation:pulse 2.4s infinite}
    @keyframes pulse{0%{transform:scale(.8);opacity:.2}45%{opacity:.75}100%{transform:scale(3);opacity:0}}
    .side{border-left:1px solid var(--line);background:#0a1419;display:flex;flex-direction:column;min-height:0}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
    .tab{border:0;border-right:1px solid var(--line);background:#0b171c;color:var(--muted);height:48px;cursor:pointer;font-weight:700}.tab:last-child{border-right:0}.tab.active{color:var(--ink);background:#13242a;box-shadow:inset 0 -2px var(--amber)}
    .panel{padding:18px;overflow:auto;flex:1}.panel h2{font-size:.84rem;color:var(--teal);letter-spacing:.14em;text-transform:uppercase;margin:0 0 16px}.empty{color:var(--dim);line-height:1.7;margin:10px 0}
    .inventory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

    .journal-entry{border-left:2px solid var(--line);padding:0 0 14px 12px;margin-bottom:14px}.journal-entry time{display:block;color:var(--dim);font-size:.72rem;margin-bottom:4px}.journal-entry p{margin:0;color:#cbd3cf;line-height:1.55;font-size:.9rem}

  function mergeState(saved) {
    var base = freshState();
    if (!saved || typeof saved !== 'object') return base;
    Object.keys(base).forEach(function (key) {
      if (saved[key] !== undefined) base[key] = saved[key];
    });
    base.flags = Object.assign(freshState().flags, saved.flags || {});
    base.clock = Object.assign({ h: 12, m: 0 }, saved.clock || {});
    base.overlay = Object.assign({ x: 0, y: 0, r: 0 }, saved.overlay || {});
    if (!Array.isArray(base.items)) base.items = [];
    if (!Array.isArray(base.journal)) base.journal = [];
    if (!Array.isArray(base.acoustic) || base.acoustic.length !== 9) base.acoustic = freshState().acoustic;
    if (!Array.isArray(base.phase) || base.phase.length !== 4) base.phase = [1, 1, 1, 1];
    if (!Array.isArray(base.consoleRoute)) base.consoleRoute = [];
    if (!Array.isArray(base.spliceDraft)) base.spliceDraft = [];
    return base;
  }

  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) state = mergeState(JSON.parse(raw));
    } catch (error) {
      state = freshState();
    }
  }

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (error) {}
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char];
    });
  }

  function roomTitle(room) {
    return { control: '제1관제실', archive: '음원자료실', studio: '스튜디오 A' }[room] || '';
  }

  function hasItem(id) { return state.items.indexOf(id) >= 0; }

  function addItem(id, quiet) {
    if (!hasItem(id)) {
      state.items.push(id);
      if (!quiet) toast((itemInfo[id] ? itemInfo[id].name : id) + '을(를) 얻었다.');
    }
  }

  function removeItem(id) {
    state.items = state.items.filter(function (item) { return item !== id; });
    if (state.selected === id) state.selected = null;
  }

  function addJournal(key, text, room) {
    if (state.journal.some(function (entry) { return entry.key === key; })) return;
    state.journal.push({ key: key, text: text, room: room || roomTitle(state.room) });
  }

  function injectControls() {
    var topbar = $('.topbar');
    var sound = $('#soundToggle');
    if (!$('#assistButton')) {
      var assist = document.createElement('button');
      assist.className = 'icon-btn';
      assist.id = 'assistButton';
      assist.setAttribute('aria-label', '탐색 보조 켜기');
      assist.textContent = '◌';
      topbar.insertBefore(assist, sound);
    }
    if (!$('#hintButton')) {
      var hint = document.createElement('button');
      hint.className = 'icon-btn';
      hint.id = 'hintButton';
      hint.setAttribute('aria-label', '호출기 힌트');
      hint.textContent = '?';
      topbar.insertBefore(hint, sound);
    }
    if (!$('#restartButton')) {
      var reset = document.createElement('button');
      reset.className = 'icon-btn';
      reset.id = 'restartButton';
      reset.setAttribute('aria-label', '처음부터 다시 시작');
      reset.textContent = '↺';
      topbar.insertBefore(reset, sound);
    }
    if (!$('#heldItem')) {
      var held = document.createElement('div');
      held.className = 'held hidden';
      held.id = 'heldItem';
      $('.viewport').appendChild(held);
    }
    if (!$('#mobileActions')) {
      var actions = document.createElement('div');
      actions.className = 'mobile-actionbar';
      actions.id = 'mobileActions';
      actions.innerHTML = '<button id="mobileAssist" type="button">탐색 보조</button><button id="mobileHint" type="button">힌트</button><button id="mobileRestart" type="button">초기화</button><button id="mobileSound" type="button">소리</button>';
      $('#sidePanel').insertBefore(actions, $('#sidePanel').firstChild);
    }
    if (!$('#panHint')) {
      var panHint = document.createElement('div');
      panHint.className = 'pan-hint hidden';
      panHint.id = 'panHint';
      panHint.textContent = '↔ 화면을 밀어 주변을 살핀다';
      $('.viewport').appendChild(panHint);
    }
  }

  function render() {
    renderRoom();
    renderInventory();
    renderJournal();
    renderTimer();
    renderHeld();
    $('#notepad').value = state.notes || '';
    $('#soundToggle').textContent = state.sound ? '♩' : '×';
    document.body.classList.toggle('assist-on', !!state.assist);
    $('#assistButton').textContent = state.assist ? '◉' : '◌';
    $('#assistButton').setAttribute('aria-label', state.assist ? '탐색 보조 끄기' : '탐색 보조 켜기');
    $('#mobileAssist').classList.toggle('active', !!state.assist);
    $('#mobileAssist').textContent = state.assist ? '보조 켜짐' : '탐색 보조';
    $('#mobileSound').classList.toggle('active', !!state.sound);
    $('#mobileSound').textContent = state.sound ? '소리 켜짐' : '소리 꺼짐';
    $('#panHint').classList.toggle('hidden', state.mobileTipSeen || window.innerWidth > 900 || !state.started);
  }

  function renderRoom() {
    var data = getRoomData(state.room);
    $('#roomTitle').textContent = data.title;
    $('#roomImage').src = data.image;
    $('#roomImage').alt = data.alt;
    var host = $('#hotspots');
    host.innerHTML = '';
    data.hotspots.forEach(function (hotspot) {
      var button = document.createElement('button');
      button.className = 'hotspot' + (hotspot.done ? ' done' : '');
      button.style.left = hotspot.x + '%';
      button.style.top = hotspot.y + '%';
      button.style.width = hotspot.w + '%';
      button.style.height = hotspot.h + '%';
      button.setAttribute('aria-label', hotspot.label);
      button.innerHTML = '<span>' + escapeHtml(hotspot.label) + '</span>';
      button.addEventListener('click', hotspot.action);
      host.appendChild(button);
    });
    $$('.room-btn').forEach(function (button) {
      var target = button.dataset.room;
      button.classList.toggle('active', target === state.room);
      button.classList.toggle('locked', (target === 'archive' && !state.flags.archiveUnlocked) || (target === 'studio' && !state.flags.powerRestored));
      if (target === 'archive') button.textContent = state.flags.archiveUnlocked ? '음원자료실' : '음원자료실 ◇';
      if (target === 'studio') button.textContent = state.flags.powerRestored ? '스튜디오 A' : '스튜디오 A ◇';
    });
  }

  function renderInventory() {
    var container = $('#inventory');
    if (!state.items.length) {
      container.innerHTML = '<p class="empty">아직 주운 물건이 없다.</p>';
      return;
    }
    container.innerHTML = state.items.map(function (id) {
      var info = itemInfo[id] || { name: id, icon: '◆', desc: '' };
      return '<button class="item ' + (state.selected === id ? 'selected' : '') + '" data-item="' + escapeHtml(id) + '" title="' + escapeHtml(info.desc) + '"><span class="item-icon">' + info.icon + '</span><span class="item-name">' + escapeHtml(info.name) + '</span><span class="item-meta">' + (state.selected === id ? '손에 든 상태' : '선택해 사용') + '</span></button>';
    }).join('');
    $$('[data-item]').forEach(function (button) {
      button.addEventListener('click', function () { selectItem(button.dataset.item); });
    });
  }

  function renderJournal() {
    var container = $('#journal');
    if (!state.journal.length) {
      container.innerHTML = '<p class="empty">확인한 단서가 여기에 남는다.</p>';
      return;
    }
    container.innerHTML = state.journal.slice().reverse().map(function (entry) {
      return '<div class="journal-entry"><time>' + escapeHtml(entry.room) + '</time><p>' + escapeHtml(entry.text) + '</p></div>';
    }).join('');
  }

  function renderHeld() {
    var held = $('#heldItem');
    if (!state.selected || !itemInfo[state.selected]) {
      held.classList.add('hidden');
      held.textContent = '';
      return;
    }
    held.classList.remove('hidden');
    held.textContent = '손에 든 것 · ' + itemInfo[state.selected].name;
  }

  function renderTimer() {
    var minutes = Math.floor(state.elapsed / 60);
    var seconds = state.elapsed % 60;
    $('#timer').textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  function selectItem(id) {
    if (state.selected && state.selected !== id) {
      if (tryCombine(state.selected, id)) return;
    }
    state.selected = state.selected === id ? null : id;
    save();
    renderInventory();
    renderHeld();
    if (state.selected) toast(itemInfo[id].name + '을(를) 손에 들었다. ' + itemInfo[id].desc);
    else toast('손을 비웠다.');
  }

  function tryCombine(a, b) {
    var pair = [a, b].sort().join('+');
    if (pair === ['battery', 'copper'].sort().join('+')) {
      removeItem('battery');
      removeItem('copper');
      addItem('cell', true);
      state.flags.cellBuilt = true;
      state.selected = 'cell';
      addJournal('cell', '건식 전지의 빈 홈에 구리 접점을 끼우자 비상 전원셀이 완성됐다.', '소지품');
      save();
      renderInventory();
      renderJournal();
      renderHeld();
      toast('두 부품이 정확히 맞물렸다. 복원한 전원셀이 완성됐다.');
      tone(520, 0.12);
      return true;
    }
    toast('두 물건은 서로 맞지 않는다.');
    return false;
  }

  function inspect(title, text, kicker) {
    openModal(title, '<p>' + escapeHtml(text) + '</p>', kicker || '관찰');
  }

  function openModal(title, html, kicker) {
    modalReturn = document.activeElement;
    $('#modalTitle').textContent = title;
    $('#modalKicker').textContent = kicker || '관찰';
    $('#modalBody').innerHTML = html;
    $('#modalWrap').classList.remove('hidden');
    $('#modalClose').focus();
  }

  function closeModal() {
    $('#modalWrap').classList.add('hidden');
    if (modalReturn && modalReturn.focus) modalReturn.focus();
  }

  function toast(message) {
    var node = $('#toast');
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(node._timer);
    node._timer = setTimeout(function () { node.classList.remove('show'); }, 3100);
  }

  function startTimer() {
    clearInterval(tickId);
    state.lastTick = Date.now();
    tickId = setInterval(function () {
      if (!state.started || state.ending) return;
      var now = Date.now();
      var delta = Math.floor((now - state.lastTick) / 1000);
      if (delta > 0) {
        state.elapsed += delta;
        state.lastTick += delta * 1000;
        renderTimer();
        if (state.elapsed % 15 === 0) save();
      }
    }, 1000);
  }

  function startGame() {
    state.started = true;
    state.lastTick = Date.now();
    save();
    $('#startScreen').classList.add('hidden');
    $('#gameScreen').classList.remove('hidden');
    render();
    startTimer();
    if (state.ending) {
      setTimeout(function () { showEnding(state.ending); }, 0);
      return;
    }
    setTimeout(function () {
      toast('현관이 등 뒤에서 잠겼다. 관제실 어딘가에서 전화벨이 한 번 울린다.');
    }, 420);
  }

  function navigate(room) {
    if (room === 'archive' && !state.flags.archiveUnlocked) {
      toast('문 옆 리더기가 출입증을 기다리고 있다.');
      return;
    }
    if (room === 'studio' && !state.flags.powerRestored) {
      toast('스튜디오 전자문에 전력이 들어오지 않는다.');
      return;
    }
    state.room = room;
    state.selected = null;
    save();
    render();
    if (window.innerWidth <= 900) $('#sidePanel').classList.remove('open');
  }

  function ensureAudio() {
    if (!audioContext) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioContext = new Ctx();
    }
    if (audioContext && audioContext.state === 'suspended') audioContext.resume();
    return audioContext;
  }

  function tone(frequency, duration, delay, gainValue) {
    if (!state.sound) return;
    var context = ensureAudio();
    if (!context) return;
    var oscillator = context.createOscillator();
    var gain = context.createGain();
    var start = context.currentTime + (delay || 0);
    oscillator.type = 'sine';
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(gainValue || 0.11, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(context.destination);

  function openAcoustic() {
    if (state.flags.acousticSolved) {
      inspect('열린 흡음 패널', '금빛 홈이 하나의 경로로 이어져 있다. 뒤 비밀칸은 비어 있다.');
      return;
    }
    var types = ['elbow','elbow','inert','elbow','straight','elbow','inert','elbow','elbow'];
    var correct = [1,2,0,3,0,1,0,0,3];
    openModal(
      '회전하는 흡음 패널',
      '<p>' + (state.flags.glassRevealed ? '편광판으로 본 입구와 출구 표식이 가장자리에 남아 있다.' : '패널마다 금빛 홈이 있지만 어디서 시작하는지 보이지 않는다.') + '</p>' +
      '<div class="acoustic-grid" id="acousticGrid"></div><p class="status" id="acousticStatus">' + (state.flags.glassRevealed ? '각 패널을 눌러 길을 회전시킬 수 있다.' : '시작과 끝을 알 수 없어 완성 여부를 판단하기 어렵다.') + '</p>',
      '공간 장치'
    );
    function drawTiles() {
      $('#acousticGrid').innerHTML = types.map(function (type, index) {
        var inert = type === 'inert';
        var markers = '';
        if (state.flags.glassRevealed && index === 3) markers += '<i class="path-entry"></i>';
        if (state.flags.glassRevealed && index === 5) markers += '<i class="path-exit"></i>';
        return '<button class="acoustic-tile ' + (inert ? 'inert' : '') + '" data-tile="' + index + '" ' + (inert ? 'disabled' : '') + ' aria-label="패널 ' + (index + 1) + '">' + (inert ? '' : '<i class="pipe ' + type + '" style="--rot:' + state.acoustic[index] + '"></i>') + markers + '</button>';
      }).join('');
      $$('.acoustic-tile:not(.inert)').forEach(function (button) {
        button.onclick = function () {
          var index = Number(button.dataset.tile);
          state.acoustic[index] = (state.acoustic[index] + 1) % (types[index] === 'straight' ? 2 : 4);
          save();
          drawTiles();
          checkPath();
        };
      });
    }
    function checkPath() {
      var match = correct.every(function (value, index) {
        if (types[index] === 'inert') return true;
        if (types[index] === 'straight') return state.acoustic[index] % 2 === value;
        return state.acoustic[index] === value;
      });
      if (match && state.flags.glassRevealed) {
        state.flags.acousticSolved = true;
        addItem('tapeD', true);
        addItem('serviceKey', true);
        addJournal('acoustic', '흡음 패널의 금빛 홈을 한 길로 잇자 뒤쪽 칸이 열렸다. 마지막 리더가 붙은 테이프 조각과 옥상 정비키가 있었다.');
        save();
        render();
        $('#acousticStatus').textContent = '금빛 경로가 한 번 밝아지고, 패널 뒤에서 걸쇠가 풀린다.';
        tone(390, 0.15);
        tone(780, 0.15, 0.14);
        setTimeout(function () { toast('테이프 조각과 옥상 정비키를 얻었다.'); }, 280);
      }
    }
    drawTiles();
    checkPath();
  }

  function openSplicePuzzle() {
    var info = {
      tapeA: { label: '조각 A', edges: '◐ → ⌁', text: '하나씩 꺼진 뒤,' },
      tapeB: { label: '조각 B', edges: '≋ → ◆', text: '아무 말도 없는' },
      tapeC: { label: '조각 C', edges: '┃ → ◐', text: '창밖에 불이' },
      tapeD: { label: '조각 D', edges: '◆ → ┃', text: '방송이 시작됐다.' },
      tapeE: { label: '조각 E', edges: '⌁ → ≋', text: '03시 17분,' }
    };
    var all = ['tapeA','tapeB','tapeC','tapeD','tapeE'];
    state.spliceDraft = state.spliceDraft.filter(function (id) { return all.indexOf(id) >= 0; });
    openModal(
      '03:17 마스터 접합',
      '<p>각 조각의 절단 무늬와 녹음된 문장 양쪽이 모두 자연스럽게 이어져야 한다. 조각을 눌러 순서대로 올린다.</p>' +
      '<div class="fragment-pool" id="fragmentPool"></div><div class="splice-strip" id="spliceStrip"></div>' +
      '<div class="object-actions"><button id="spliceUndo">마지막 조각 빼기</button><button id="spliceReset">전부 내리기</button><button id="spliceCheck">접합한다</button></div><p class="status" id="spliceStatus">투명 리더가 붙은 첫 조각부터 찾아야 한다.</p>',
      '테이프 편집'
    );
    function fragmentHtml(id) {
      return '<button class="fragment" data-frag="' + id + '"><span class="edge"><b>' + info[id].label + '</b><b>' + info[id].edges + '</b></span><small>“…' + info[id].text + '…”</small></button>';
    }
    function draw() {
      var remaining = all.filter(function (id) { return state.spliceDraft.indexOf(id) < 0; });
      $('#fragmentPool').innerHTML = remaining.map(fragmentHtml).join('');
      $('#spliceStrip').innerHTML = state.spliceDraft.length ? state.spliceDraft.map(fragmentHtml).join('') : '<span class="empty">여기에 왼쪽부터 놓인다.</span>';
      $$('#fragmentPool [data-frag]').forEach(function (button) {
        button.onclick = function () {
          state.spliceDraft.push(button.dataset.frag);
          save();
          draw();
        };
      });
      $$('#spliceStrip [data-frag]').forEach(function (button) {
        button.onclick = function () {
          var index = state.spliceDraft.indexOf(button.dataset.frag);
          if (index >= 0) state.spliceDraft.splice(index, 1);
          save();
          draw();
        };
      });
    }
    $('#spliceUndo').onclick = function () { state.spliceDraft.pop(); save(); draw(); };
    $('#spliceReset').onclick = function () { state.spliceDraft = []; save(); draw(); };
    $('#spliceCheck').onclick = function () {
      var correct = ['tapeC','tapeA','tapeE','tapeB','tapeD'];
      if (state.spliceDraft.length < 5) {
        $('#spliceStatus').textContent = '빈 홈이 남아 있다.';
        return;
      }
      var match = correct.every(function (id, index) { return state.spliceDraft[index] === id; });
      if (!match) {
        $('#spliceStatus').textContent = '절단면 하나가 뜨고, 문장도 중간에서 끊긴다.';
        tone(115, 0.18, 0, 0.045);
        return;
      }
      ['tapeA','tapeB','tapeC','tapeD','tapeE','spliceTape'].forEach(removeItem);
      addItem('restoredReel', true);
      state.flags.spliceSolved = true;
      state.spliceDraft = [];
      addJournal('splice', '절단면과 녹음 문장을 맞춰 다섯 조각을 하나의 03:17 마스터 릴로 복원했다.');
      save();
      render();
      $('#spliceStatus').textContent = '모든 절단면이 평평하다. 릴이 끊김 없이 손으로 돌아간다.';
      tone(520, 0.12);
      tone(720, 0.13, 0.12);
      toast('복원한 마스터 릴을 얻었다.');
    };
    draw();
  }

  function openConsole() {

    openModal(

  function waveformSvg(values, color) {
    var width = 360;
    var height = 54;
    var step = width / (values.length - 1);
    var points = values.map(function (value, index) {
      return (index * step).toFixed(1) + ',' + (height / 2 - value * 4.4).toFixed(1);
    }).join(' ');
    return '<svg class="phase-wave" viewBox="0 0 360 54" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="27" x2="360" y2="27" stroke="#314249" stroke-width="1"/><polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>';
  }

  function openTransmitter() {
    if (!state.flags.consoleSolved) {
      openModal('송신 랙', '<p>전원은 켜졌지만 INPUT BUS 표시가 비어 있다. 관제실에서 신호를 먼저 보내야 한다.</p><div class="artifact"><p class="artifact-title">위상 보정기</p><p>REFERENCE A / B / C / D</p></div>', '입력 없음');
      return;
    }
    if (state.flags.cancelReady) {
      openModal('상쇄 신호 발생기', '<p>결과 파형은 완전히 평평하다. 상쇄 신호가 옥상 안테나로 대기 중이다.</p>' + waveformSvg([0,0,0,0,0,0,0,0], '#77b9b1') + '<p class="phase-flat">CANCEL BUS READY</p>', '보정 완료');
      return;
    }
    var waves = [
      [2,1,-1,-2,0,2,-1,-2],
      [0,2,1,-1,-2,0,2,-1],
      [-1,0,2,1,-1,-2,0,1],
      [-3,1,4,2,-3,-4,3,2]
    ];
    openModal(
      '위상 상쇄 보정기',
      '<p>A는 기준 채널이라 고정돼 있다. B–D의 위상을 뒤집어 네 파형의 합을 평평하게 만들어야 한다.</p><div id="phaseRows"></div><div class="phase-result"><p class="artifact-title">합성 파형</p><div id="sumWave"></div><p class="status" id="phaseStatus">굴곡이 남아 있다.</p></div><div class="object-actions"><button id="lockPhase">상쇄 상태 고정</button></div>',
      '송신 보정'
    );
    function drawPhase() {
      var colors = ['#e4b45f','#d96a5f','#77b9b1','#9d8bcc'];
      $('#phaseRows').innerHTML = waves.map(function (wave, index) {
        return '<div class="phase-row"><span class="phase-label">' + String.fromCharCode(65 + index) + '</span>' +
          waveformSvg(wave.map(function (value) { return value * state.phase[index]; }), colors[index]) +
          (index === 0 ? '<button class="phase-toggle" disabled>기준</button>' : '<button class="phase-toggle ' + (state.phase[index] === -1 ? 'inverted' : '') + '" data-phase="' + index + '">' + (state.phase[index] === -1 ? '반전' : '정상') + '</button>') +
          '</div>';
      }).join('');
      var sum = waves[0].map(function (_, sample) {
        return waves.reduce(function (total, wave, index) { return total + wave[sample] * state.phase[index]; }, 0);
      });
      $('#sumWave').innerHTML = waveformSvg(sum, '#eef2ed');
      var flat = sum.every(function (value) { return value === 0; });
      $('#phaseStatus').textContent = flat ? '모든 샘플이 기준선에서 사라졌다.' : '상쇄되지 않은 굴곡이 남아 있다.';
      $('#phaseStatus').className = 'status' + (flat ? ' phase-flat' : '');
      $$('.phase-toggle[data-phase]').forEach(function (button) {
        button.onclick = function () {
          var index = Number(button.dataset.phase);
          state.phase[index] *= -1;
          save();
          drawPhase();
          tone(state.phase[index] === -1 ? 310 : 230, 0.08, 0, 0.035);
        };
      });
    }
    $('#lockPhase').onclick = function () {
      var correct = state.phase[0] === 1 && state.phase[1] === -1 && state.phase[2] === -1 && state.phase[3] === 1;
      if (!correct) {
        $('#phaseStatus').textContent = '파형이 아직 기준선을 벗어난다. 이 상태로는 원 신호가 더 커진다.';
        tone(90, 0.25, 0, 0.05);
        return;
      }
      state.flags.cancelReady = true;
      addJournal('phase', 'B와 C의 위상을 반전해 네 채널의 합성 파형을 완전히 평평하게 만들었다. 상쇄 신호가 준비됐다.');
      save();
      render();
      $('#phaseStatus').textContent = 'CANCEL BUS READY — 옥상 안테나로 신호를 보낼 수 있다.';
      tone(440, 0.16);
      tone(880, 0.18, 0.16);
      toast('상쇄 신호가 준비됐다.');
    };
    drawPhase();
  }

  function showEnding(type) {
    closeModal();
    state.ending = type;
    save();
    clearInterval(tickId);
    var existing = $('#endingScreen');
    if (existing) existing.remove();
    var node = document.createElement('section');
    node.id = 'endingScreen';
    var hintCount = Object.keys(state.hints).reduce(function (sum, key) { return sum + state.hints[key]; }, 0);
    var time = Math.floor(state.elapsed / 60) + '분 ' + (state.elapsed % 60) + '초';
    if (type === 'true') {
      node.className = 'ending true';
      node.innerHTML = '<div class="ending-inner"><p class="ending-mark">04:01</p><h2>도시가 처음으로 조용해졌다</h2><p>북서쪽 빈 산맥으로 상쇄 신호가 퍼진다. 관제실의 멈춘 시계가 한 번 움직이고, 03:17에 갇혀 있던 모든 장비가 꺼진다. 윤서하 PD의 마지막 육성은 방송되지 않았다. 그래서 누구도 그 목소리를 다시 복제하지 못한다.</p><div class="stats"><span>경과 ' + time + '</span><span>호출기 ' + hintCount + '회</span><span>결말 TRUE SIGNAL</span></div><button class="primary" id="endingRestart">처음부터 다시 조사</button></div>';
    } else if (type === 'original') {
      node.className = 'ending bad';
      node.innerHTML = '<div class="ending-inner"><p class="ending-mark">03:17</p><h2>네 목소리가 다음 호출이 되었다</h2><p>원본 마스터가 도시 회선에 닿자 모든 창문의 불이 같은 박자로 깜빡인다. 수화기에서 방금 전 네가 했던 말이 흘러나온다. 누군가는 그 호출을 받고 이 건물로 들어올 것이다.</p><div class="stats"><span>결말 DEAD AIR</span><span>송출 직전 되감기 가능</span></div><button class="primary" id="endingRewind">송출 직전으로 되감기</button></div>';
    } else {
      node.className = 'ending bad';
      node.innerHTML = '<div class="ending-inner"><p class="ending-mark">REPEAT</p><h2>상쇄 신호가 도시를 덮쳤다</h2><p>방향이 어긋난 안테나는 원 신호와 상쇄 신호를 같은 거리로 보낸다. 두 파형은 사라지지 않고 더 큰 맥박이 된다. 모든 시계가 03:17로 돌아간다.</p><div class="stats"><span>결말 WRONG HORIZON</span><span>방향 재조정 가능</span></div><button class="primary" id="endingRewind">송출 직전으로 되감기</button></div>';
    }
    document.body.appendChild(node);
    if ($('#endingRewind')) $('#endingRewind').onclick = function () {
      node.remove();
      state.ending = null;
      save();
      startTimer();
      openRoofPanel();
    };
    if ($('#endingRestart')) $('#endingRestart').onclick = restartNow;
  }

  function currentHintKey() {
    if (!state.flags.clockSolved) return 'clock';
    if (!state.flags.overlaySolved) return 'overlay';
    if (!state.flags.shelfOpened) return 'shelf';
    if (!state.flags.coinTaken) return 'coin';
    if (!state.flags.ventOpened) return 'vent';
    if (!state.flags.cabinetOpened) return 'cabinet';
    if (!state.flags.powerRestored) return 'power';
    if (!state.flags.phoneRubbed || !state.flags.phoneDialed) return 'phone';
    if (!state.flags.pianoSolved) return 'piano';
    if (!state.flags.glassRevealed) return 'glass';
    if (!state.flags.acousticSolved) return 'panels';
    if (!state.flags.deckFragmentTaken) return 'deckFragment';
    var fragments = ['tapeA','tapeB','tapeC','tapeD','tapeE'].filter(hasItem).length;
    if (!state.flags.spliceSolved && fragments < 5) return 'fragments';
    if (!hasItem('spliceTape') && !state.flags.spliceSolved) return 'spliceTape';
    if (!state.flags.spliceSolved) return 'splice';
    if (!state.flags.hiddenChannel) return 'deck';
    if (!state.flags.consoleSolved) return 'console';
    if (!state.flags.cancelReady) return 'phase';
    if (!state.flags.roofOpen) return 'roofKey';
    if (!state.flags.mapDecoded) return 'roofMap';
    return 'final';
  }

  function openHint() {
    var key = currentHintKey();
    var level = Math.min((state.hints[key] || 0) + 1, 3);
    state.hints[key] = level;
    save();
    openModal(
      '호출기 수신',
      '<div class="hint-card"><div class="hint-level">단계 ' + level + ' / 3</div><p>' + escapeHtml(hints[key][level - 1]) + '</p></div>' +
      (level < 3 ? '<p>같은 진행 단계에서 다시 호출하면 더 직접적인 메시지가 온다.</p>' : '<p>이 단계의 가장 직접적인 힌트다.</p>'),
      '외부 힌트'
    );
  }

  function confirmRestart() {
    openModal(
      '조사를 처음부터 다시 시작할까?',
      '<p>현재 소지품, 메모, 경과 시간과 진행 기록이 모두 지워진다.</p><div class="object-actions"><button id="cancelRestart">계속 조사</button><button id="confirmRestart" style="border-color:#d94b3f;color:#ff9b92">모든 기록 삭제</button></div>',
      '기록 초기화'
    );
    $('#cancelRestart').onclick = closeModal;
    $('#confirmRestart').onclick = restartNow;
  }

  function restartNow() {
    try { localStorage.removeItem(SAVE_KEY); } catch (error) {}
    window.location.reload();
  }

  function toggleAssist() {
    state.assist = !state.assist;
    save();
    render();
    toast(state.assist ? '탐색 보조를 켰다. 조사할 수 있는 곳이 표시된다.' : '탐색 보조를 껐다. 이제 장면을 직접 관찰한다.');
  }

  function toggleSound() {
    state.sound = !state.sound;
    save();
    render();
    toast(state.sound ? '소리를 켰다.' : '소리를 껐다. 모든 음 퍼즐에는 시각 표시도 있다.');
  }

  function wireBaseEvents() {
    $('#startButton').onclick = startGame;
    $('#modalClose').onclick = closeModal;
    $('#modalWrap').onclick = function (event) { if (event.target === $('#modalWrap')) closeModal(); };
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !$('#modalWrap').classList.contains('hidden')) closeModal();
    });
    $$('.tab').forEach(function (button) {
      button.onclick = function () {
        $$('.tab').forEach(function (tab) { tab.classList.toggle('active', tab === button); });
        ['inventory','journal','notes'].forEach(function (id) {
          $('#' + id + 'Panel').classList.toggle('hidden', id !== button.dataset.tab);
        });
      };
    });
    $('#notepad').addEventListener('input', function (event) {
      state.notes = event.target.value;
      save();
    });
    $('#mobilePanel').onclick = function () {
      var open = $('#sidePanel').classList.toggle('open');
      $('#mobilePanel').setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    $('#assistButton').onclick = toggleAssist;
    $('#soundToggle').onclick = toggleSound;
    $('#hintButton').onclick = openHint;
    $('#restartButton').onclick = confirmRestart;
    $('#mobileAssist').onclick = toggleAssist;
    $('#mobileHint').onclick = openHint;
    $('#mobileRestart').onclick = confirmRestart;
    $('#mobileSound').onclick = toggleSound;
    $('.viewport').addEventListener('scroll', function () {
      if (!state.mobileTipSeen && window.innerWidth <= 900) {
        state.mobileTipSeen = true;
        $('#panHint').classList.add('hidden');
        save();
      }
    }, { passive: true });
    $$('.room-btn').forEach(function (button) {
      button.onclick = function () { navigate(button.dataset.room); };
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && state.started && !state.ending) {
        var now = Date.now();
        state.elapsed += Math.max(0, Math.floor((now - state.lastTick) / 1000));
        state.lastTick = now;
        save();
      } else if (!document.hidden) {
        state.lastTick = Date.now();
      }
    });
    window.addEventListener('beforeunload', save);
  }

  function init() {
    load();
    // 시작 동작은 다른 UI 초기화보다 먼저 연결한다. 일부 모바일 브라우저에서
    // 부가 컨트롤 생성이 실패해도 입장 버튼이 함께 멈추지 않게 한다.
    $('#startButton').onclick = startGame;
    try {
      injectControls();
      wireBaseEvents();
    } catch (error) {
      console.error('DEAD AIR UI initialization failed:', error);
    }
    // 저장된 진행도가 있어도 방문 시에는 타이틀 화면부터 시작한다.
    // 자동 진입 대신 버튼 문구로 새 게임/이어하기 상태만 구분한다.
    $('#startScreen').classList.remove('hidden');
    $('#gameScreen').classList.add('hidden');
    if (state.ending) $('#startButton').textContent = '마지막 방송 다시 보기';
    else if (state.started) $('#startButton').textContent = '조사 이어가기';
    else $('#startButton').textContent = '방송국에 들어간다';
    render();
  }

  init();
})();
